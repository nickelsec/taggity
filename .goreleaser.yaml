# Release artifacts. Pure Go with cgo disabled, so every target cross-compiles
# from one runner and every binary is genuinely static.
#
# Run `make release-check` before tagging: it validates this file and builds a
# full snapshot without publishing anything.
version: 2

project_name: taggity

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: taggity
    main: ./cmd/taggity
    binary: taggity

    # A hard constraint, not a preference: `go install` must work without a C
    # toolchain. Nothing in the tree needs cgo: go-git and gotreesitter are
    # both pure Go, which is why gotreesitter was chosen in the first place.
    env:
      - CGO_ENABLED=0

    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

    # The same variable the Makefile sets, so a release binary and a local build
    # report their version through one code path.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

    # Identical input must produce identical output. A tool whose pitch is
    # reproducibility cannot ship binaries that are not themselves reproducible:
    # -trimpath removes local filesystem paths, and mod_timestamp pins the
    # embedded build time to the commit rather than to when the runner happened
    # to start.
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: taggity
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - SECURITY.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# An SPDX SBOM per archive, generated by syft.
sboms:
  - id: archive
    artifacts: archive

# A snapshot build must not be mistakable for a release.
snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  # CHANGELOG.md is the authoritative record. This only groups the commits that
  # landed, so the release page is not a wall of unsorted subjects.
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
  groups:
    - title: Added
      regexp: '^feat'
      order: 0
    - title: Fixed
      regexp: '^fix'
      order: 1

release:
  header: |
    See [CHANGELOG.md](https://github.com/nickelsec/taggity/blob/{{ .Tag }}/CHANGELOG.md) for the full notes.

    Verify a download against `checksums.txt`. Each archive ships an SPDX SBOM.
  footer: |
    ---
    Built from {{ .FullCommit }} with CGO_ENABLED=0 and -trimpath.
  # Draft, so a tag push never publishes on its own. Releasing stays a
  # deliberate act.
  draft: true
  prerelease: auto
