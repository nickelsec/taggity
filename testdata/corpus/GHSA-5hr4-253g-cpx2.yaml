# web3.py SSRF (CWE-918). async_handle_offchain_lookup followed a CCIP Read
# (EIP-3668) OffchainLookup URL taken from contract data without validating its
# scheme or host, so a contract could drive the client to fetch internal
# addresses from its own network position.
#
# The fix added scheme and host validation before the request, and stopped
# following redirects.
#
# Advisory claims TWO ranges, fixed independently:
#   >= 6.0.0b3, < 7.15.0
#   >= 8.0.0b1, < 8.0.0b2
#
# The 8.x tags are spelled v8.0.0-beta.N in git and 8.0.0bN in the advisory.
# Both normalise to the same PEP 440 version, which is what the tag index is
# for, and this case exercises it on a real advisory.
#
# INVERTED POLARITY. The fix ADDED a guard, so the question is "is the guard
# present":
#   NOT_VULNERABLE (guard absent)  -> the fix is missing
#   VULNERABLE     (guard present) -> the fix is applied
package:
  ecosystem: PyPI
  name: web3
repo: https://github.com/ethereum/web3.py
advisory: GHSA-5hr4-253g-cpx2

authoring:
  mode: manual
  reviewed_by: nick

signal:
  code:
    file: web3/utils/async_exception_handling.py
    symbol: async_handle_offchain_lookup
    rule:
      calls: async_validate_ccip_url_host
      indicates: fixed
