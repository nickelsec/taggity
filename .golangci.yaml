version: "2"

linters:
  default: all
  disable:
    - cyclop          # gocyclo/gocognit already cover this
    - exhaustruct     # partial struct literals are idiomatic here
    - funlen          # length alone is not a defect
    - gochecknoglobals # build-time version injection needs one
    - gocognit        # overlaps gocyclo
    - godox           # TODO comments are fine in an early project
    - ireturn         # returning interfaces is the point of the seams
    - lll             # gofmt already governs layout
    - mnd             # not every literal is a magic number
    - nlreturn        # stylistic
    - nonamedreturns  # named returns document multi-value results
    - varnamelen      # short names are fine in short scopes
    - wsl             # stylistic whitespace rules
    - wsl_v5          # ditto

    # Terminal output is the product. Checking every fmt.Fprintf into a report
    # writer would bury the reporting code in error handling for a failure mode
    # (a broken stdout) that the CLI cannot act on anyway. Errors that matter --
    # writing OSV to a file, reading a spec -- are checked explicitly.
    - errcheck
    # Sentinel error types for CLI-level messages would be indirection with one
    # caller. Library errors that a caller might branch on are wrapped with %w.
    - err113
    - noinlineerr    # `if err := f(); err != nil` is idiomatic Go
    - wrapcheck      # %w wrapping is applied where context helps, not blanket
    # Every test here touches a shared on-disk clone cache or a tree-sitter
    # parser; making them parallel would be a correctness change, not a style
    # one, and the suite already runs in seconds.
    - paralleltest
    - testpackage    # invariant_test.go must see unexported package internals
    # The corpus tests repeat version strings and advisory IDs deliberately:
    # each is evidence tied to one case, and hoisting them into constants would
    # make the assertions harder to read against the published advisory.
    - goconst
    - dogsled        # `_, _, err :=` reads fine against multi-value APIs
    - tagliatelle    # OSV field names are fixed by the schema, not by us
    - funcorder      # exported/unexported ordering is grouped by topic here
    - godoclint      # comment style is enforced by review, not by pattern

    - gomodguard     # superseded by gomodguard_v2, which `default: all` enables

  enable:
    - depguard

  settings:
    depguard:
      rules:
        # A model must never sit in an evaluation path: the same spec has to
        # produce the same verdict on every run. Only cmd may reach internal/llm,
        # to wire up `draft` and the --llm flag; every engine package is denied,
        # so a violation is a build failure rather than something a reviewer has
        # to notice.
        #
        # This rule silently did nothing until 0.3.0, because depguard was listed
        # under both disable and enable and disable wins. TestDepguardDeniesLLM
        # in cmd/taggity now imports it deliberately and fails if the rule stops
        # firing, since a guarantee nobody has watched fail is not a guarantee.
        llm-out-of-engine:
          files:
            - "**/internal/audit/*.go"
            - "**/internal/check/*.go"
            - "**/internal/git/*.go"
            - "**/internal/predicate/*.go"
            - "**/internal/spec/*.go"
            - "**/internal/taggity/*.go"
          deny:
            - pkg: github.com/nickelsec/taggity/internal/llm
              desc: >-
                evaluation code must not import internal/llm; a model proposes
                what to look for and deterministic code decides what is there

        # The domain package defines verdict semantics and must not depend on
        # how sources are fetched or parsed.
        domain-stays-leaf:
          files:
            - "**/internal/taggity/*.go"
          deny:
            - pkg: github.com/nickelsec/taggity/internal
              desc: internal/taggity is a leaf package and imports no siblings

    exhaustive:
      default-signifies-exhaustive: true

    govet:
      enable-all: true
      disable:
        - fieldalignment  # readability wins over struct packing here
        # `if err := f(); err != nil` scopes err to the branch that handles it,
        # which is idiomatic Go and narrower than the alternative. Rewriting to
        # satisfy this check would widen the scope it objects to.
        - shadow

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
